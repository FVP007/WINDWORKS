<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Visualizador 3D</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #2a2a2a;
        }

        #viewer {
            width: 100%;
            height: 100%;
            background-color: #f0f0f0;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div id="loading">Carregando visualizador...</div>

    <script type="module" src="model-viewer.min.js"></script>

    <model-viewer id="viewer"
                  camera-controls
                  src="Delta.glb"
                  touch-action="pan-y"
                  shadow-intensity="1"
                  auto-rotate
                  camera-orbit="45deg 75deg 105%"
                  style="display: none;">
    </model-viewer>

    <script src="main.js"></script>
</body>
</html>
